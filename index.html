<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Congelados JEMY · Hacé tu pedido</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="barra">
    <h1 id="titulo">Congelados JEMY</h1>
    <button id="btn-carrito" class="btn-carrito">🛒 Carrito <span id="contador">0</span></button>
  </header>

  <!-- PASO 1: catálogo -->
  <main id="vista-catalogo">
    <div class="filtros">
      <input id="buscar" type="search" placeholder="Buscar producto…">
      <div id="categorias" class="chips"></div>
    </div>
    <div id="catalogo" class="grilla"></div>
  </main>

  <!-- Carrito lateral -->
  <aside id="carrito" class="carrito" aria-hidden="true">
    <div class="carrito-cab">
      <h2>Tu pedido</h2>
      <button id="cerrar-carrito" class="x" aria-label="Cerrar">✕</button>
    </div>
    <div id="lista-carrito"></div>
    <div class="carrito-total">Total: <strong id="total-carrito">$ 0</strong></div>
    <button id="btn-continuar" class="btn primario" disabled>Continuar con mis datos</button>
  </aside>
  <div id="fondo" class="fondo"></div>

  <!-- PASO 2: datos del cliente -->
  <main id="vista-datos" hidden>
    <button class="volver" data-ir="catalogo">← Seguir comprando</button>
    <h2>Completá tus datos</h2>
    <form id="form-datos" class="formulario">
      <label>Nombre y apellido *<input name="nombre" required autocomplete="name"></label>
      <label>Teléfono *<input name="telefono" type="tel" required autocomplete="tel"></label>
      <label>Forma de entrega *
        <select name="entrega">
          <option value="envio">Envío a domicilio</option>
          <option value="retiro">Retiro en el local</option>
        </select>
      </label>
      <label class="dir">Dirección *<input name="direccion" required autocomplete="street-address" placeholder="Calle, número, piso/depto"></label>
      <label class="dir">Localidad<input name="localidad" autocomplete="address-level2"></label>
      <label>Fecha de entrega *<input name="fechaEntrega" type="date" required></label>
      <label>Horario preferido
        <select name="horario">
          <option value="">Indistinto</option>
          <option>Mañana (9 a 13 h)</option>
          <option>Tarde (13 a 18 h)</option>
          <option>Noche (18 a 21 h)</option>
        </select>
      </label>
      <label>Forma de pago *
        <select name="pago">
          <option>Efectivo</option>
          <option>Transferencia</option>
          <option>Mercado Pago</option>
        </select>
      </label>
      <label class="ancho">Observaciones<textarea name="observaciones" rows="3" placeholder="Timbre, referencias, aclaraciones…"></textarea></label>
      <button class="btn primario ancho" type="submit">Ver remito</button>
    </form>
  </main>

  <!-- PASO 3: remito -->
  <main id="vista-remito" hidden>
    <div class="acciones no-imprimir">
      <button class="volver" data-ir="datos">← Modificar datos</button>
      <button id="btn-imprimir" class="btn">🖨️ Imprimir / Guardar PDF</button>
      <button id="btn-enviar" class="btn primario">📲 Enviar pedido por WhatsApp</button>
    </div>
    <div id="remito"></div>
    <p class="aviso no-imprimir">Al tocar <strong>Enviar pedido</strong> se abre WhatsApp con tu pedido listo para mandarnos.</p>
  </main>

  <div id="gracias" class="gracias" hidden>
    <h2>¡Gracias por tu pedido!</h2>
    <p>Si no se abrió WhatsApp, volvé a tocar el botón. Te vamos a confirmar a la brevedad.</p>
    <button class="btn primario" id="nuevo-pedido">Hacer otro pedido</button>
  </div>

  <script src="productos.js"></script>
  <script src="comun.js"></script>
  <script src="app.js"></script>
</body>
</html>
